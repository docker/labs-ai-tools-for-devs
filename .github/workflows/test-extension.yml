name: Test Extension

on:
  push:
    branches:
      - main

jobs:
  test:
    defaults:
      run:
        working-directory: src/extension/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: npm ci
      - run: npm run build
      - run: npm run test
